name: CI

on:
  push:
    branches: [main, integration/production-readiness-candidate, integration/reconcile-20261012]
  pull_request:
    branches: [main, integration/production-readiness-candidate, integration/reconcile-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build

      - name: Verify built application entry point
        run: test -s public/app/index.html

      - name: Upload cPanel-ready frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: semizzy-thrift-frontend
          path: public/app/
          if-no-files-found: error
          retention-days: 14

  domain-tests:
    name: PHP domain and application checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: composer lint

      - name: Run domain tests
        run: ./vendor/bin/phpunit --display-skipped

      - name: Verify Laravel boots and routes register
        run: php artisan route:list --except-vendor
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

      - name: Verify migrations and country seed
        run: php artisan migrate:fresh --seed --force
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

  mysql8-wallet-gate:
    name: MySQL 8 wallet, withdrawal and ledger gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: thrift_collector_test
          MYSQL_USER: thrift_test
          MYSQL_PASSWORD: thrift_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL and verify server version
        run: |
          for attempt in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uthrift_test -pthrift_test_password --silent; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3306 -uthrift_test -pthrift_test_password -Nse "SELECT VERSION()" | grep -E '^8\.0\.'

      - name: Allow trigger creation in disposable MySQL CI database
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Run all migrations and seed the disposable MySQL database
        run: php artisan migrate:fresh --seed --force
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: thrift_collector_test
          DB_USERNAME: thrift_test
          DB_PASSWORD: thrift_test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

      - name: Exercise withdrawal idempotency and competing balance protection on MySQL
        run: ./vendor/bin/phpunit --filter='withdrawal_debits_wallet_once_and_rejection_refunds_once|competing_withdrawals_cannot_spend_the_same_wallet_balance_twice|successful_withdrawal_settlement_does_not_debit_wallet_twice|confirmed_failure_after_approval_refunds_wallet_once'
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: thrift_collector_test
          DB_USERNAME: thrift_test
          DB_PASSWORD: thrift_test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

      - name: Exercise true independent-connection wallet races on MySQL
        run: ./vendor/bin/phpunit tests/Feature/WalletLedgerConcurrencyTest.php
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: thrift_collector_test
          DB_USERNAME: thrift_test
          DB_PASSWORD: thrift_test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

      - name: Run complete PHP test suite on MySQL 8
        run: ./vendor/bin/phpunit --display-skipped
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: thrift_collector_test
          DB_USERNAME: thrift_test
          DB_PASSWORD: thrift_test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          LOG_CHANNEL: stderr

  publish-frontend-to-main:
    name: Publish verified frontend assets to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-build, domain-tests, mysql8-wallet-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: semizzy-thrift-frontend
          path: public/app

      - name: Commit generated frontend assets to main
        run: |
          test -s public/app/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/app
          if git diff --cached --quiet; then
            echo "Generated frontend assets already match main."
          else
            git commit -m "Publish verified Semizzy Thrift frontend assets"
            git push origin HEAD:main
          fi

  deployment-package:
    name: Assemble cPanel deployment package
    runs-on: ubuntu-latest
    needs: [frontend-build, domain-tests, mysql8-wallet-gate]
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Set up PHP for production dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install production Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        env:
          APP_ENV: production
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Download tested frontend build
        uses: actions/download-artifact@v4
        with:
          name: semizzy-thrift-frontend
          path: public/app

      - name: Assemble source, migrations, docs and compiled frontend
        run: |
          test -s public/app/index.html
          mkdir -p deployment-package
          cp -a app bootstrap config database docs public resources routes storage vendor deployment-package/
          cp -a artisan composer.json composer.lock .env.example README.md deployment-package/
          test ! -e deployment-package/.env
          test -s deployment-package/public/app/index.html
          zip -qr semizzy-thrift-deployment.zip deployment-package

      - name: Upload full cPanel deployment package
        uses: actions/upload-artifact@v4
        with:
          name: semizzy-thrift-deployment
          path: semizzy-thrift-deployment.zip
          if-no-files-found: error
          retention-days: 14
